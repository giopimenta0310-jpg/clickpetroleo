<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPG — Gerador</title><style>
:root{--red:#e52b2d;--bg:#0a0a0b;--panel:#161618;--field:#202023;--line:#323237;--text:#f7f7f7;--muted:#a7a7ad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}header{padding:20px 28px;border-bottom:1px solid var(--line);font-weight:bold;font-size:18px}main{max-width:1360px;margin:auto;padding:28px;display:grid;grid-template-columns:minmax(360px,1fr) 400px;gap:28px}.preview{position:sticky;top:20px;align-self:start}.frame{min-height:650px;padding:16px;display:grid;place-items:center;background:#111;border:1px solid var(--line);border-radius:14px}canvas{display:block;max-width:100%;max-height:76vh;background:#000;box-shadow:0 15px 45px #0008}.note,.hint,.status{font-size:12px;color:var(--muted);line-height:1.45}.note{text-align:center}.panel{padding:18px;margin-bottom:15px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.panel h2{margin:0 0 13px;font-size:13px;text-transform:uppercase;letter-spacing:1px}.templates,.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}button,input,textarea,select{font:inherit}button{color:var(--text);cursor:pointer;border:1px solid var(--line);background:var(--field);border-radius:9px;padding:11px}.active{border-color:var(--red)!important;box-shadow:inset 0 0 0 1px var(--red)}label{display:block;color:var(--muted);font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:.8px;margin:13px 0 6px}input,textarea,select{width:100%;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px}textarea{min-height:74px}.button{width:100%;margin-top:8px}.primary{background:var(--red);border-color:var(--red);font-weight:bold}.check{display:flex;gap:7px;align-items:center;text-transform:none;letter-spacing:0;color:var(--text)}.check input{width:auto}.slider{display:grid;grid-template-columns:24px 1fr;gap:5px;align-items:center;margin:4px 0}.slider output{color:var(--muted);font-size:11px}@media(max-width:900px){main{grid-template-columns:1fr}.preview{position:static}.frame{min-height:0}}
</style></head><body><header>CPG · Gerador de criativos</header><main><section class="preview"><div class="frame"><canvas id="canvas"></canvas></div><p class="note" id="dimensions"></p></section><aside>
<section class="panel"><h2>Modelo e formato</h2><div class="templates"><button class="active" data-model="article">Matéria em destaque</button><button data-model="weekly">Resumo semanal</button></div><label>Formato</label><select id="format"></select><p class="hint">Feed, Stories/TikTok, Google responsivo e Google Display estático.</p></section>
<section class="panel" id="articlePanel"><h2>Matéria</h2><label>URL da matéria</label><input id="url" type="url" placeholder="https://…"><button class="button" id="load">Carregar título e imagem</button><label>Título <span id="count"></span></label><textarea id="title" maxlength="150">Navio-hospital promete mais de 40 mil atendimentos por ano na Amazônia</textarea><label>Imagem alternativa</label><input id="upload" type="file" accept="image/*"></section>
<section class="panel" id="weeklyPanel" hidden><h2>3 matérias da semana</h2><p class="hint">Cada URL cria um card com título e imagem de fundo desfocada. Você pode editar os títulos depois.</p><label>Card 1</label><input class="week" type="url" placeholder="https://…"><label>Título do card 1 (opcional)</label><input class="weekTitle" maxlength="150" placeholder="Preenchido automaticamente pela URL"><label>Card 2</label><input class="week" type="url" placeholder="https://…"><label>Título do card 2 (opcional)</label><input class="weekTitle" maxlength="150" placeholder="Preenchido automaticamente pela URL"><label>Card 3</label><input class="week" type="url" placeholder="https://…"><label>Título do card 3 (opcional)</label><input class="weekTitle" maxlength="150" placeholder="Preenchido automaticamente pela URL"><label>Desfoque das imagens</label><div class="slider"><output id="blurO">50</output><input id="blur" type="range" min="0" max="100" value="50"></div><button class="button" id="loadWeeks">Carregar cards</button></section>
<section class="panel"><h2>Marca e fundo</h2><label>Chamada geral</label><input id="eyebrow" value="A notícia que todo mundo comentou essa semana"><label>CTA</label><input id="cta" value="Quero receber por e-mail"><div class="row"><div><label>Fundo</label><select id="bg"><option value="black">Preto</option><option value="graphite">Grafite</option><option value="wine">Bordô</option><option value="gradient">Gradiente vermelho</option><option value="texture">Textura diagonal</option><option value="custom">RGB personalizado</option></select></div><div><label>RGB</label><div class="slider"><output id="ro">14</output><input id="r" type="range" min="0" max="255" value="14"></div><div class="slider"><output id="go">14</output><input id="g" type="range" min="0" max="255" value="14"></div><div class="slider"><output id="bo">16</output><input id="b" type="range" min="0" max="255" value="16"></div></div></div><label>Imagem de fundo</label><input id="bgUpload" type="file" accept="image/*"><label class="check"><input id="showLogo" type="checkbox" checked>Exibir logo CPG</label></section>
<section class="panel"><h2>Exportar</h2><button class="button primary" id="download">Baixar PNG</button><div class="status" id="status"></div></section></aside></main>
<script>
const $=x=>document.getElementById(x),C=$('canvas'),X=C.getContext('2d'),L=new Image();L.src='assets/logo-click-petroleo-e-gas.webp';
const F=[['Feed · 1080×1350',1080,1350],['Stories / TikTok · 1080×1920',1080,1920],['Google responsivo · 1200×628',1200,628],['Google responsivo · 1200×1200',1200,1200],['Google responsivo · 900×1600',900,1600],['Google Display · 200×200',200,200],['Google Display · 240×400',240,400],['Google Display · 250×250',250,250],['Google Display · 250×360',250,360],['Google Display · 300×250',300,250],['Google Display · 336×280',336,280],['Google Display · 120×600',120,600],['Google Display · 160×600',160,600],['Google Display · 300×600',300,600],['Google Display · 300×1050',300,1050],['Google Display · 468×60',468,60],['Google Display · 728×90',728,90],['Google Display · 970×250',970,250],['Google Display · 320×50',320,50]];
F.forEach((a,i)=>{let o=document.createElement('option');o.value=i;o.textContent=a[0];$('format').append(o)});let mode='article',image=null,backgroundImage=null,cards=[null,null,null];
function pick(){let f=F[+$('format').value];return{w:f[1],h:f[2],n:f[0]}}function msg(t,e=false){$('status').textContent=t;$('status').style.color=e?'#ff9898':''}function read(file,fn){if(!file)return;let i=new Image();i.onload=()=>fn(i);i.src=URL.createObjectURL(file)}function get(src,fn){let i=new Image();i.crossOrigin='anonymous';i.onload=()=>fn(i);i.onerror=()=>msg('Imagem bloqueada; envie o arquivo manualmente.',true);i.src=src}
function margin(w,h){return Math.max(8,Math.min(w*.065,h*.055))}function textWidth(w,h,usable){return usable*.90}function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,Math.min(r,w/2,h/2))}function bg(w,h){let k=$('bg').value;if(k==='custom')X.fillStyle='rgb('+$('r').value+','+$('g').value+','+$('b').value+')';else if(k==='gradient'){let q=X.createLinearGradient(0,0,w,h);q.addColorStop(0,'#300608');q.addColorStop(1,'#09090a');X.fillStyle=q}else X.fillStyle={black:'#09090a',graphite:'#17171a',wine:'#241013',texture:'#101013'}[k];X.fillRect(0,0,w,h);if(backgroundImage){let z=Math.max(w/backgroundImage.width,h/backgroundImage.height);X.save();X.globalAlpha=.18;X.drawImage(backgroundImage,(w-backgroundImage.width*z)/2,(h-backgroundImage.height*z)/2,backgroundImage.width*z,backgroundImage.height*z);X.restore()}if(k==='texture'){X.strokeStyle='rgba(255,255,255,.05)';for(let x=-h;x<w;x+=w*.06){X.beginPath();X.moveTo(x,0);X.lineTo(x+h,h);X.stroke()}}}
function lines(t,w,s){X.font='700 '+s+'px Arial';let out=[],line='';String(t||'').trim().split(/\s+/).forEach(word=>{let n=line?line+' '+word:word;if(line&&X.measureText(n).width>w){out.push(line);line=word}else line=n});if(line)out.push(line);return out}function fit(t,w,h,max,min=3,maxLines=99){for(let s=max;s>=min;s-=.5){let a=lines(t,w,s),z=a.length*s*1.16;if(a.length<=maxLines&&z<=h)return{s,a,z,w,h}}let a=lines(t,w,min);return{s:min,a,z:a.length*min*1.16,w,h}}function write(b,x,y,color='#fff'){X.fillStyle=color;X.font='700 '+b.s+'px Arial';X.textAlign='center';X.textBaseline='top';b.a.forEach((q,i)=>X.fillText(q,x,y+i*b.s*1.16))}function cover(i,x,y,w,h,blur=0){if(!i||!i.width)return;X.save();rr(x,y,w,h,Math.min(w,h)*.035);X.clip();let z=Math.max(w/i.width,h/i.height);X.filter=blur?'blur('+blur+'px)':'none';X.drawImage(i,x+(w-i.width*z)/2,y+(h-i.height*z)/2,i.width*z,i.height*z);X.restore()}
function logo(w,h,y){if(!$('showLogo').checked||!L.naturalWidth)return 0;let lw=Math.min(w*.13,h*.105,150),lh=lw*L.naturalHeight/L.naturalWidth;X.save();X.globalAlpha=.72;X.drawImage(L,(w-lw)/2,y,lw,lh);X.restore();return lh}function button(w,y,h,t,m){let bw=Math.min(w-m*2,Math.max(w*.31,Math.min(w*.52,t.length*Math.max(5,h*.4)*.72+w*.065))),x=(w-bw)/2;X.fillStyle='#e52b2d';rr(x,y,bw,h,h*.25);X.fill();let b=fit(t,bw*.82,h*.6,h*.4);write(b,w/2,y+(h-b.z)/2)}
function article(w,h){let m=margin(w,h),uw=w-m*2;if(h/w<.22)return compact(w,h,m);if(w/h>1.35)return horizontalArticle(w,h,m);let tw=textWidth(w,h,uw),gap=Math.max(5,m*.38),lh=$('showLogo').checked&&L.naturalWidth?Math.min(w*.13,h*.105,150)*L.naturalHeight/L.naturalWidth:0,logoGap=lh?gap:0,head=fit($('eyebrow').value,tw,h*.105,Math.min(w*.041,h*.047)),bh=Math.max(15,Math.min(h*.072,60)),available=h-m*2,reserve=Math.max(26,h*.30),ih=Math.max(Math.min(h*.29,available-lh-logoGap-head.z-bh-gap*3-reserve),Math.min(h*.14,Math.max(18,available-lh-logoGap-head.z-bh-gap*3-reserve))),titleSpace=available-lh-logoGap-head.z-ih-bh-gap*3,title=fit($('title').value,tw,titleSpace,Math.min(w*.059,h*.054),3,5),group=lh+logoGap+head.z+gap+ih+gap+title.z+gap+bh,start=m+Math.max(0,(available-group)/2),hy=start+lh+logoGap,iy=hy+head.z+gap,ty=iy+ih+gap,by=ty+title.z+gap;if(lh)logo(w,h,start);write(head,w/2,hy,'#e52b2d');cover(image,m,iy,uw,ih);write(title,w/2,ty);button(w,by,bh,$('cta').value,m)}
function horizontalArticle(w,h,m){let gap=Math.max(8,m*.45),iw=(w-m*2)*.42,ih=h-m*2,ix=m,iy=m,rx=ix+iw+gap,rw=w-rx-m,lh=$('showLogo').checked&&L.naturalWidth?Math.min(rw*.28,h*.12,112)*L.naturalHeight/L.naturalWidth:0,head=fit($('eyebrow').value,rw*.94,h*.17,Math.min(rw*.055,h*.05)),bh=Math.max(18,Math.min(h*.085,54)),titleSpace=h-m*2-lh-(lh?gap:0)-head.z-gap*2-bh,title=fit($('title').value,rw*.94,titleSpace,Math.min(rw*.072,h*.065),3,5),group=lh+(lh?gap:0)+head.z+gap+title.z+gap+bh,start=(h-group)/2;if(lh){let lw=lh*L.naturalWidth/L.naturalHeight;X.save();X.globalAlpha=.72;X.drawImage(L,rx+(rw-lw)/2,start,lw,lh);X.restore()}let hy=start+lh+(lh?gap:0),ty=hy+head.z+gap,by=ty+title.z+gap;cover(image,ix,iy,iw,ih);write(head,rx+rw/2,hy,'#e52b2d');write(title,rx+rw/2,ty);X.fillStyle='#e52b2d';let bw=Math.min(rw*.82,Math.max(rw*.46,$('cta').value.length*Math.max(6,bh*.4)*.70)),bx=rx+(rw-bw)/2;rr(bx,by,bw,bh,bh*.25);X.fill();let bt=fit($('cta').value,bw*.82,bh*.6,bh*.4);write(bt,rx+rw/2,by+(bh-bt.z)/2)}
function compact(w,h,m){let iw=w*.22,cw=w*.25,tx=m+iw+w*.015,tw=w-tx-m-cw-w*.02;cover(image,m,m,iw,h-m*2);let b=fit($('title').value,tw,h-m*2,Math.min(h*.4,w*.035),2);write(b,tx+tw/2,(h-b.z)/2);button(w,(h-Math.max(8,h*.45))/2,Math.max(8,h*.45),$('cta').value,m)}
function card(item,x,y,w,h){X.fillStyle='#251214';rr(x,y,w,h,Math.min(w,h)*.04);X.fill();cover(item,x,y,w,h,+$('blur').value&&Math.max(2,w*.0005*$('blur').value));X.fillStyle='rgba(8,8,10,.65)';rr(x,y,w,h,Math.min(w,h)*.04);X.fill();let b=fit(item?.title||'Adicione uma URL para este destaque',w*.78,h*.64,Math.min(w*.095,h*.20));write(b,x+w/2,y+(h-b.z)/2)}
function weekly(w,h){let m=margin(w,h),uw=w-m*2,wide=w/h>1.35,tw=textWidth(w,h,uw),gap=Math.max(5,m*.38),lh=$('showLogo').checked&&L.naturalWidth?Math.min(w*.13,h*.105,150)*L.naturalHeight/L.naturalWidth:0,logoGap=lh?gap:0,head=fit('As notícias da semana, reunidas',tw,h*.1,Math.min(w*.04,h*.046)),bh=Math.max(13,Math.min(h*.055,48)),available=h-m*2,desired=wide?h*.46:h*.55,maxCards=available-lh-logoGap-head.z-bh-gap*2,cardSpace=Math.max(12,Math.min(desired,maxCards)),group=lh+logoGap+head.z+gap+cardSpace+gap+bh,start=m+Math.max(0,(available-group)/2),hy=start+lh+logoGap,cardY=hy+head.z+gap,by=cardY+cardSpace+gap;if(lh)logo(w,h,start);write(head,w/2,hy,'#e52b2d');if(wide){let cg=gap,cw=(uw-cg*2)/3;for(let i=0;i<3;i++)card(cards[i],m+i*(cw+cg),cardY,cw,cardSpace)}else{let cg=gap*.65,ch=(cardSpace-cg*2)/3;for(let i=0;i<3;i++)card(cards[i],m,cardY+i*(ch+cg),uw,ch)}button(w,by,bh,$('cta').value,m)}
function draw(){let f=pick();C.width=f.w;C.height=f.h;bg(f.w,f.h);mode==='article'?article(f.w,f.h):weekly(f.w,f.h);$('dimensions').textContent=f.n+' · '+f.w+' × '+f.h}
async function preview(url){let r=await fetch('/api/preview?url='+encodeURIComponent(url));if(!r.ok)throw Error();return r.json()}$('load').onclick=async()=>{try{msg('Carregando…');let d=await preview($('url').value);$('title').value=(d.title||'').slice(0,150);count();if(d.image)get(d.image,i=>{image=i;draw()});else draw();msg('Matéria carregada.')}catch{msg('Não foi possível carregar esta URL.',true)}};$('loadWeeks').onclick=async()=>{let titles=[...document.querySelectorAll('.weekTitle')];for(let [index,e] of [...document.querySelectorAll('.week')].entries()){if(!e.value)continue;try{let d=await preview(e.value),t=(titles[index].value.trim()||d.title||'').slice(0,150);if(!titles[index].value.trim())titles[index].value=t;if(d.image)get(d.image,loaded=>{loaded.title=t;cards[index]=loaded;draw()});else cards[index]={title:t}}catch{msg('Uma URL não pôde ser carregada.',true)}}draw()};
$('upload').onchange=e=>read(e.target.files[0],i=>{image=i;draw()});$('bgUpload').onchange=e=>read(e.target.files[0],i=>{backgroundImage=i;draw()});function count(){$('count').textContent=$('title').value.length+'/150'}$('title').oninput=()=>{count();draw()};document.querySelectorAll('.weekTitle').forEach((field,index)=>field.oninput=()=>{if(!cards[index])cards[index]={title:field.value};else cards[index].title=field.value;draw()});['format','eyebrow','cta','bg','showLogo'].forEach(id=>$(id).oninput=draw);[['r','ro'],['g','go'],['b','bo'],['blur','blurO']].forEach(a=>$(a[0]).oninput=()=>{$(a[1]).value=$(a[0]).value;draw()});document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{mode=b.dataset.model;document.querySelectorAll('[data-model]').forEach(x=>x.classList.toggle('active',x===b));$('articlePanel').hidden=mode!=='article';$('weeklyPanel').hidden=mode!=='weekly';draw()});$('download').onclick=()=>C.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cpg-'+pick().w+'x'+pick().h+'.png';a.click()});L.onload=draw;count();draw();
</script></body></html>
